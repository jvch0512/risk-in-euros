name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests
      - name: Sample outputs are up to date
        run: |
          python -m risk_in_euros examples/scenarios.json > /tmp/r.md; diff /tmp/r.md docs/sample-report.md
          python -m risk_in_euros examples/scenarios.json --html > /tmp/r.html; diff /tmp/r.html site/index.html
